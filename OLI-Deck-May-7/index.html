<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OLI · Investor Deck · Seed Round 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#0d0d0e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}

  .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}

  .slide{
    position:absolute;
    width:min(96vw, calc(94vh * 16/9));
    aspect-ratio:16/9;
    background:#fff;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 30px 100px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.3);
    opacity:0;pointer-events:none;
    transform:scale(.985) translateY(8px);
    transition:opacity .42s ease,transform .42s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .slide.active{opacity:1;pointer-events:auto;transform:none;}

  /* PDF page rendered as image */
  .slide img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* Live HTML slide via iframe — auto-scales to fit 16:9 viewport */
  .slide.embed{background:#FFFFFF;}
  .slide.embed iframe{
    width:1440px;height:810px;
    border:0;display:block;
    transform-origin:top left;
  }
  .slide.embed .scaler{
    width:1440px;height:810px;
    transform-origin:top left;
    position:relative;
  }

  /* Navigation chrome */
  .nav{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;z-index:100;
    background:rgba(20,20,22,.78);backdrop-filter:blur(14px);
    padding:8px 14px;border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
  }
  .nav-btn{
    background:transparent;border:none;color:#fff;cursor:pointer;
    font-family:inherit;font-size:11px;font-weight:400;
    letter-spacing:.18em;padding:6px 12px;border-radius:999px;
    text-transform:uppercase;opacity:.85;
  }
  .nav-btn:hover{opacity:1;background:rgba(255,255,255,.08);}
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;}
  .nav-counter{
    font-size:11px;color:#fff;font-variant-numeric:tabular-nums;
    letter-spacing:.18em;min-width:60px;text-align:center;
    padding:0 6px;border-left:1px solid rgba(255,255,255,.12);
    border-right:1px solid rgba(255,255,255,.12);
  }
  .hint{
    position:fixed;top:14px;right:18px;z-index:100;
    color:rgba(255,255,255,.45);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:500;
  }

  /* Print: one slide per page (image slides only — iframe slides are skipped) */
  @media print{
    @page{size:1440px 810px;margin:0;}
    html,body{background:#fff;overflow:visible;}
    .deck{position:static;}
    .slide{
      position:relative;width:1440px;height:810px;
      page-break-after:always;
      opacity:1;pointer-events:auto;transform:none;
      box-shadow:none;border-radius:0;aspect-ratio:auto;inset:auto;
    }
    .nav,.hint{display:none;}
  }
</style>
</head>
<body>

<div class="hint" id="hint">← → to navigate · 1 / 21</div>

<div class="deck" id="deck">

<nav class="nav">
  <button class="nav-btn" id="prev">← Prev</button>
  <span class="nav-counter" id="counter">1 / 21</span>
  <button class="nav-btn" id="next">Next →</button>
</nav>

<script>
(function(){
  const slides  = Array.from(document.querySelectorAll('.slide'));
  const counter = document.getElementById('counter');
  const hint    = document.getElementById('hint');
  const total   = slides.length;
  let i = 0;

  // Scale embedded iframe slides so the fixed 1440×810 inner page fits the responsive .slide box.
  function scaleEmbeds(){
    document.querySelectorAll('.slide.embed').forEach(slide => {
      const scaler = slide.querySelector('.scaler');
      if(!scaler) return;
      const r = slide.getBoundingClientRect();
      const sx = r.width  / 1440;
      const sy = r.height / 810;
      const s  = Math.min(sx, sy);
      scaler.style.transform = 'scale(' + s + ')';
      // Center it
      const ox = (r.width  - 1440 * s) / 2;
      const oy = (r.height -  810 * s) / 2;
      scaler.style.left = ox + 'px';
      scaler.style.top  = oy + 'px';
      scaler.style.position = 'absolute';
    });
  }

  function go(n){
    i = Math.max(0, Math.min(total - 1, n));
    slides.forEach((s,k) => s.classList.toggle('active', k === i));
    counter.textContent = (i+1) + ' / ' + total;
    if(hint) hint.textContent = '← → to navigate · ' + (i+1) + ' / ' + total;
    if(history.replaceState) history.replaceState(null, '', '#' + (i+1));
    scaleEmbeds();
  }

  document.getElementById('prev').addEventListener('click', () => go(i-1));
  document.getElementById('next').addEventListener('click', () => go(i+1));

  document.addEventListener('keydown', (e) => {
    // Don't intercept keys when the user is interacting with the embedded iframe
    if(e.target && e.target.tagName === 'IFRAME') return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){ e.preventDefault(); go(i+1); }
    else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(i-1); }
    else if(e.key === 'Home'){ go(0); }
    else if(e.key === 'End'){ go(total - 1); }
  });

  // Wheel navigation (debounced)
  let lastWheel = 0;
  document.addEventListener('wheel', (e) => {
    const now = Date.now();
    if(now - lastWheel < 700) return;
    if(Math.abs(e.deltaY) < 30) return;
    lastWheel = now;
    go(i + (e.deltaY > 0 ? 1 : -1));
  }, {passive:true});

  // Touch swipe
  let touchStart = null;
  document.addEventListener('touchstart', (e) => { touchStart = e.touches[0].clientX; });
  document.addEventListener('touchend', (e) => {
    if(touchStart === null) return;
    const dx = e.changedTouches[0].clientX - touchStart;
    if(Math.abs(dx) > 60) go(i + (dx < 0 ? 1 : -1));
    touchStart = null;
  });

  window.addEventListener('resize', scaleEmbeds);

  // Honor #N hash on load (e.g., #4 jumps directly to slide 4)
  const m = location.hash.match(/^#(\d+)$/);
  if(m) go(parseInt(m[1], 10) - 1);
  else  scaleEmbeds();
})();
</script>

</body>
